<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Kick-It! store screenshot</title>
<link rel="stylesheet" href="/src/style.css">
<style>
  html, body { margin: 0; width: 360px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Fredoka', system-ui, sans-serif;
    background:
      radial-gradient(120% 60% at 50% 0%, var(--glow) 0%, transparent 60%),
      repeating-linear-gradient(115deg, var(--stripe) 0 34px, transparent 34px 68px),
      linear-gradient(180deg, var(--grass-a) 0%, var(--grass-b) 100%);
  }
  /* the pitch below the floors: a halfway line and the centre circle */
  .sf-line { position: absolute; left: 0; right: 0; top: 404px; height: 3px; background: var(--paint-soft); }
  .sf-ring { position: absolute; left: 50%; top: 405px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border: 3px solid var(--paint-soft); border-radius: 50%; }
  .sf-head { position: absolute; left: 12px; right: 12px; top: 22px; display: grid; justify-items: center; gap: 10px; text-align: center; z-index: 2; }
  .sf-title { margin: 0; display: grid; font-size: 35px; font-weight: 700; line-height: 1.02; text-transform: uppercase; letter-spacing: 0.01em; color: var(--paper); text-shadow: var(--outline), 0 5px 0 var(--ink); }
  .sf-title b { color: var(--gold); font-weight: 700; }
  .sf-ribbon { display: inline-flex; padding: 5px 24px; background: var(--ink); color: var(--paper); clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 50%, 100% 100%, 0 100%, 10px 50%); font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; line-height: 1.25; text-transform: uppercase; white-space: nowrap; transform: rotate(-2deg); }
  .sf-card { position: absolute; left: 50%; top: 150px; width: 260px; height: 462px; margin-left: -130px; border: 4px solid var(--ink); border-radius: 28px; overflow: hidden; background: var(--ink); box-shadow: 0 8px 0 var(--ink), 0 22px 40px var(--shade); transform: rotate(var(--tilt)); z-index: 1; }
  .sf-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .sf-deco { position: absolute; z-index: 3; overflow: visible; }
  .sf-deco.star path { fill: var(--gold); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
  .sf-deco.glint path { fill: var(--paper); stroke: var(--ink); stroke-width: 0.7; stroke-linejoin: round; }
  .sf-deco.glint.gold path { fill: var(--gold); }
</style>
</head>
<body>
  <div class="sf-line"></div><div class="sf-ring"></div>
  <header class="sf-head"><h1 class="sf-title" id="title"></h1><p class="sf-ribbon" id="ribbon"></p></header>
  <div class="sf-card" id="card"><img id="shot" alt=""></div>
  <script type="module" src="./store-frame.ts"></script>
</body></html>
